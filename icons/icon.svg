<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="胸囲充足率レコーダー">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2e6e4e"/>
      <stop offset="1" stop-color="#234f39"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- メジャー（胸囲）を表すリングと目盛り -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="#ecede7" stroke-width="18"/>
  <g stroke="#ecede7" stroke-width="10" stroke-linecap="round" opacity="0.85">
    <line x1="256" y1="92" x2="256" y2="118"/>
    <line x1="256" y1="394" x2="256" y2="420"/>
    <line x1="92" y1="256" x2="118" y2="256"/>
    <line x1="394" y1="256" x2="420" y2="256"/>
  </g>

  <!-- 発育（充足率）を表す上昇カーブ -->
  <path d="M176 322 C 214 300, 236 250, 268 222 S 322 186, 344 180"
        fill="none" stroke="#e7b24a" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="344" cy="180" r="20" fill="#e7b24a"/>
  <circle cx="176" cy="322" r="16" fill="#ecede7"/>
</svg>
